# Build and commit the compiled site into docs/ on main.
# Repo Settings → Pages: Source = "Deploy from a branch", Branch = main, Folder = /docs
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npx playwright install chromium --with-deps

      - run: npm test

      - run: npm run test:e2e

      - name: Fetch real card artwork from Wikipedia
        run: npm run fetch:cards
        continue-on-error: true

      - run: npm run build:docs

      - name: Add .nojekyll (suppress Jekyll processing)
        run: touch docs/.nojekyll

      - name: Commit and push docs/ + fetched card art to main
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/ public/cards/ src/data/card-art-manifest.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: rebuild docs/ + refresh card art from ${GITHUB_SHA::8}"
          git push origin HEAD:${{ github.ref_name }}
